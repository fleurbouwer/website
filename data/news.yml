- date: '2025-09-26'
  kind: paper
  title: 'New paper in Cerebral Cortex: EEG responses to rhythm at different tempi'
  project: rhythm
  text: 'New paper out in Cerebral Cortex, spearheaded by Atser Damsma. When you listen to rhythm, you can often feel a regular beat. If a rhythm slows down or speeds up, your perception of the beat changes. We set out to test whether we can detect this in EEG. The answer is yes. The neural synchronisation with the beat shifts to a different level in the rhythm if we change the tempo. But then things got more interesting: we tried modelling this shift, using an entrainment model, and a simple model of evoked responses. Turns out both models can mimic the metrical shift that happens with a tempo-change! So what does neural synchronisation to beat-specific frequencies mean? We argue that evoked responses can explain more than we may have thought...'
  slug: new-paper-eeg-responses-to-rhythm-at-different-tempi
  body: 'New paper out in Cerebral Cortex, spearheaded by Atser Damsma. When you listen to rhythm, you can often feel a regular beat. If a rhythm slows down or speeds up, your perception of the beat changes. We set out to test whether we can detect this in EEG. The answer is yes. The neural synchronisation with the beat shifts to a different level in the rhythm if we change the tempo. But then things got more interesting: we tried modelling this shift, using an entrainment model, and a simple model of evoked responses. Turns out both models can mimic the metrical shift that happens with a tempo-change! So what does neural synchronisation to beat-specific frequencies mean? We argue that evoked responses can explain more than we may have thought...'
  link: https://doi.org/10.1093/cercor/bhaf258
