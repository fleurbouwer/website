  title: "New paper in Cerebral Cortex: brain responses to rhythm at different tempi"
  text: "With Atser Damsma and colleagues we show that tempo-dependent EEG responses at the beat can be mimicked by both an oscillator and an evoked model."
  link: "https://doi.org/10.1093/cercor/bhaf258"
