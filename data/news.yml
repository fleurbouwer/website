  project: rhythm
  text: 'Now officially out: our updated chapter on how to probe beat perception in human adults, newborns, and nonhuman primates. With Henkjan Honing and Gábor Háden, and with many thanks to Hugo Merchant for inviting us to update our chapter from 10 years ago. We discuss what the different aspects of rhythm are that can be probed with ERPs, and how to design stimuli that induce a beat in various ways. We also review how this has been done in human adults, newborns, and nonhuman primates.'
