  kind: paper
  title: "New paper in Cognition: modelling how we process rhythmic patterns"
  text: "Using a probabilistic computer model of temporal structure, we show that abstract representations underlie how people perceive and produce rhythms."
  link: "https://doi.org/10.1016/j.cognition.2025.106345"
  project: rhythm

