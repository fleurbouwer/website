- date: 2026-11-12
  kind: book
  pinned: true
  title: "My book What Is Music For? comes out in March 2027"
  text: "Why do we love music so much, when it is just vibrating air? In this short book for everyone, part of the What Is It For? series by Bristol University Press, I explain what science tells us about music and the brain, and debunk a few myths along the way. It can be pre-ordered now."
  link: "https://bristoluniversitypress.co.uk/trade/what-is-music-for"

- date: "2026"
  kind: paper
  title: "New paper in Journal of Alzheimer’s Disease: singing versus conversation in dementia"
  text: "Led by Dewi Boessen and Marijn Hendricksen, our pilot study in a nursing home compared singing sessions with conversation sessions, to separate the effect of music from that of company and attention."
  link: "https://doi.org/10.1177/13872877261485601"
  project: health

