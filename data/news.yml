  title: 'Paper out in PLOS ONE: beat perception without attention'
  project: rhythm
  text: ''
  slug: bouwer-f-l-van-zuijen-t-l-honing-h-2014-beat-processing-is-pre-attentive-for-metrically-simple-rhythms-with-clear-accents-an-erp-study
  body: 'Bouwer F. L., Van Zuijen, T. L., Honing, H. (2014). Beat processing is pre-attentive for metrically simple rhythms with clear accents: An ERP study.


    The perception of a regular beat is fundamental to music processing. Here we examine whether the detection of a regular beat is pre-attentive for metrically simple, acoustically varying stimuli using the mismatch negativity (MMN), an ERP response elicited by violations of acoustic regularity irrespective of whether subjects are attending to the stimuli. Both musicians and non-musicians were presented with a varying rhythm with a clear accent structure in which occasionally a sound was omitted. We compared the MMN response to the omission of identical sounds in different metrical positions. Most importantly, we found that omissions in strong metrical positions, on the beat, elicited higher amplitude MMN responses than omissions in weak metrical positions, not on the beat. This suggests that the detection of a beat is pre-attentive when highly beat inducing stimuli are used. No effects of musical expertise were found. Our results suggest that for metrically simple rhythms with clear accents
    beat processing does not require attention or musical expertise. In addition, we discuss how the use of acoustically varying stimuli may influence ERP results when studying beat processing.'
  link: https://doi.org/10.1371/journal.pone.0097467
