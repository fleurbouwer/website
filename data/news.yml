- date: 2025-12-17
  kind: grant
  title: "Open Science NL funds our replication study on music lessons and IQ"
  text: "Do music lessons really make children smarter? With Marieke Bos, we will repeat a famous 2004 study with 312 children, and look beyond IQ at attention, wellbeing and social behaviour."
  link: "https://www.openscience.nl/en/news/27-studies-re-examined"
  project: learning

