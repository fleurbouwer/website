    text: "How musical are you? Short games test your sense of pitch, rhythm, timing and memory for music, and after each game you find out what science says about it. Made with the Music Cognition Group at the University of Amsterdam, with a KNAW Gewaardeerd! grant."
    text_nl: "Hoe muzikaal ben jij? Korte spelletjes testen je gevoel voor toonhoogte, ritme, timing en muzikaal geheugen, en na elk spel lees je wat de wetenschap erover weet. Gemaakt met de muziekcognitiegroep van de Universiteit van Amsterdam, met een KNAW Gewaardeerd!-beurs."
