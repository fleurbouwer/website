lectures: "I regularly give public lectures about music and the brain. For enquiries, please email me."
lectures_nl: "Ik geef regelmatig lezingen over muziek en het brein. Voor aanvragen kunt u mij mailen."

book:
  title: "What Is Music For?"
  series: "What Is It For? series"
  publisher: "Bristol University Press"
  publisher_url: "https://bristoluniversitypress.co.uk/trade/what-is-music-for"
  date: "March 2027"
  details: "Paperback, 160 pages · ISBN 978-1-5292-5518-8 · also as ebook and audiobook"
  cover: "what-is-music-for-cover.jpg"
  text: |
    Why do we love music so much, when it is just vibrating air? Why does it accompany every wedding, funeral and party, and why do certain chords make us feel a certain way?

    In this short book for everyone, I draw on my years as a professional clarinettist and as a cognitive neuroscientist to explain what we know about music and the brain: how we make music without being taught, how it moves us, and what it does for our feelings, our bodies and our relationships. Along the way I take a critical look at some popular myths about music's magical effects.
  text_nl: "Waarom houden we zo veel van muziek, terwijl het alleen maar trillende lucht is? In dit korte boek voor iedereen leg ik uit wat we weten over muziek en het brein, en prik ik een paar populaire mythes door. Het boek verschijnt in maart 2027 in het Engels bij Bristol University Press."
