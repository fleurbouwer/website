bio: |
  Since 2023 I am an assistant professor in the Cognitive Psychology Unit at Leiden University. In my research I combine my fascination for the human brain with my passion for music, to understand how we perceive rhythm and what music does for us. Before coming to Leiden I worked on rhythm and the predictive brain as a postdoc at the University of Amsterdam (with an ABC Talent Grant, 2016–2019) and the Vrije Universiteit Amsterdam (2020), supervised by Prof. Heleen Slagter, and then on my own NWO Veni project. In June 2016 I obtained my PhD in the Music Cognition Group at the University of Amsterdam, supervised by Prof. Henkjan Honing. I hold a Master of Science in Psychology (cum laude, 2011, University of Amsterdam) and a Master of Music (with distinction, 2009, Amsterdam Conservatory).

  Before starting my PhD I spent over a decade on stage as a performing clarinettist. I studied with Herman Braune, Antony Pay and Yehuda Gilad, won several prizes (Princess Christina Competition 2001; Dutch Young Musician of the Year 2001), and played as a soloist, chamber musician, in Dutch orchestras and in the European Union Youth Orchestra.

  I teach at bachelor and master level, and I regularly speak to the public about the remarkable bond between humans and music.
