bio: |
  I am an assistant professor in the Cognitive Psychology Unit and the Leiden Institute for Brain and Cognition at Leiden University. I want to understand how music, mere vibrating air, can give us pleasure, make us move and bring us together, and what that tells us about the human brain. To find out, I combine behavioural experiments, computational models, EEG and fMRI, and I work with people from many backgrounds, from nursing homes to music schools.

  Before coming to Leiden in 2023, I was a postdoc at the University of Amsterdam, first with an ABC Talent Grant and later with an NWO Veni grant, and at the Vrije Universiteit Amsterdam. I did my PhD in the Music Cognition Group at the University of Amsterdam with Henkjan Honing (2016), and I hold a Master of Science in Psychology and a Master of Music, both cum laude.

  Before research, I spent over a decade on stage as a clarinettist. I was Dutch Young Musician of the Year in 2001, represented the Netherlands at Eurovision Young Musicians in 2002, and played in the European Union Youth Orchestra, in Dutch orchestras and as a soloist and chamber musician.

  At Leiden I teach courses from Introduction to Psychology to the Research Master and coordinate the interdisciplinary Minor Brain and Cognition. I am a board member of the Leiden Institute for Brain and Cognition and a member of the international networks ManyMusicians and MusicGens.
