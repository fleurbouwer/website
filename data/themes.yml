# Research themes. Each theme groups the projects (often grants) that feed into it.
# People and publications link to a theme by its id.

- id: rhythm
  title: "Rhythm and the predicting brain"
  short: "How the brain finds the beat, and why we differ in our sense of rhythm."
  title_nl: "Ritme en het voorspellende brein"
  short_nl: "Hoe ons brein de maat vindt, en waarom de een meer ritmegevoel heeft dan de ander."
  art: beat
  intro: |
    When you tap your foot to music, your brain is predicting when the next sound will arrive. We can do that by following a regular beat, or by learning a rhythmic pattern that repeats. Since my PhD I have been asking how these predictions work: are they automatic, do they need attention, are they one system in the brain or two, and why do some people find it easier than others? We combine behavioural experiments, computer models, EEG and fMRI, and have compared adults with newborn babies and with monkeys.
  projects:
    - title: "Who’s got rhythm? How expectations shape the way we hear music"
      funder: "Amsterdam Brain and Cognition Project Grant, 2020"
      text: |
        Some people seem to lock on to the beat, others seem to memorise the pattern. Do our brains have two ways of predicting rhythm? In this project, 120 people, including trained musicians, did rhythm tasks, and we compared their responses with two computer models: one that follows a beat (Ed Large's oscillator model) and one that learns patterns (Marcus Pearce's IDyOM). An fMRI study then compared the brain networks behind each kind of prediction.
      people: "Proposal written by Fleur Bouwer; Atser Damsma (postdoc); with Henkjan Honing and Pierre-Louis Bazin (University of Amsterdam)"
    - title: "The swinging brain: searching for our sense of rhythm"
      funder: "NWO Veni, 2020"
      text: |
        This project combined computer models and brain scans to find out how we make timing predictions in music, why people differ in their sense of rhythm, and how such predictions change in Parkinson's disease, with the long-term aim of tailoring rhythm-based therapy to the individual.
      people: "Fleur Bouwer"
    - title: "Rhythm and the predictive brain"
      funder: "Amsterdam Brain and Cognition Talent Grant, 2016–2019"
      text: |
        My first postdoc project, with Heleen Slagter and Henkjan Honing at the University of Amsterdam, used musical rhythm to study how the brain predicts across several timescales. With EEG we tested whether expectations in time ride on brain rhythms (neural oscillations) that lock on to the beat, and with fMRI we looked at the role of the basal ganglia.
      people: "Fleur Bouwer; supervised by Heleen Slagter, with Henkjan Honing"

- id: learning
  title: "Does music make us smarter?"
  short: "Testing popular claims about music lessons, musicians and the mind."
  title_nl: "Word je slimmer van muziek?"
  short_nl: "We toetsen populaire claims over muziekles, musici en denkvermogen."
  art: steps
  intro: |
    Parents, schools and policymakers often hear that music lessons boost brain development, and that musicians have better memories. Much of that rests on a handful of studies. We put these claims to careful, open tests, and look beyond IQ at what music lessons may do for attention, wellbeing and social behaviour.
  projects:
    - title: "Music makes kids smarter: myth or magic?"
      funder: "Open Science NL (NWO), Replication Studies, 2025"
      text: |
        A famous 2004 study found that children's IQ rose more after a year of music lessons than after drama or no lessons. It has never been properly repeated. In this study, 312 six-year-olds at after-school care get a year of weekly recorder, singing or drama lessons, or join a waitlist. We measure IQ before and after, and also attention and self-control, musicality, wellbeing and social behaviour. The study plan is peer-reviewed and published before any data come in.
      people: "Fleur Bouwer and Marieke Bos (Leiden University); Anika van der Klis (postdoc); partners Opstoom, Leerorkest Nederland and Hart Haarlem"
    - title: "Do musicians have better short-term memory? A multilab study"
      funder: "International collaboration"
      text: |
        Together with labs around the world, we tested whether musicians really remember more than nonmusicians, using the same tasks and analysis plan in every lab.
      people: "Led by Massimo Grassi and colleagues, with Fleur Bouwer among the contributing researchers"

- id: connection
  title: "Music and social connection"
  short: "Does sharing music bring people closer, through bodies in sync?"
  title_nl: "Muziek en verbinding"
  short_nl: "Brengt samen muziek beleven mensen dichter bij elkaar?"
  art: pairs
  intro: |
    Throughout human history, making music together has helped people connect and cooperate. We study whether simply listening to music together has the same effect, and what happens in the body and brain when it does.
  projects:
    - title: "Tuning in together: from music to cooperation through synchrony in body and mind"
      funder: "NWO Open Competition XS, 2024"
      text: |
        We investigate whether listening to music together promotes cooperation, and whether that works through the body: listeners' heart rate and skin conductance starting to move in sync. We also test whether enjoying the music adds to the effect. Pairs of participants listen to music either perfectly in sync or slightly apart, and play a cooperation game while we record their physiology.
      people: "Fleur Bouwer and Iliana Samara"

- id: health
  title: "Music for health"
  short: "Can music improve daily life in dementia and Parkinson’s disease?"
  title_nl: "Muziek en gezondheid"
  short_nl: "Kan muziek het leven met dementie of Parkinson verbeteren?"
  art: wave
  intro: |
    Musical abilities often survive long after other skills fade, and rhythm can help people with Parkinson's disease to walk. But is it really the music that helps, and does it help everyone? We test music-based approaches carefully, so they can be used where they work.
  projects:
    - title: "Music for people with dementia"
      funder: "UvA Psychology Impact Grant, 2023"
      text: |
        In a pilot at nursing home Flevohuis in Amsterdam, residents joined improvised singing sessions with the Genetic Choir, the same sessions with the singers talking instead of singing, and care as usual, so we could separate the effect of music from the effect of attention and company. We also adapted questionnaires on musical background so family members or carers can fill them in.
      people: "Fleur Bouwer and Esmee Verwijk; Marijn Hendricksen and Dewi Boessen (research assistants); with Stichting Here&Now, Zorggroep Amsterdam Oost and the Ben Sajet Centrum"
    - title: "Rhythm in Parkinson’s disease"
      funder: "Part of the NWO Veni project"
      text: |
        People with Parkinson's disease can walk better to a rhythmic cue, but not everyone benefits equally. Part of the Veni project looked at how predictions in time change in Parkinson's disease, with the aim of tailoring rhythm-based therapy to the individual.
      people: "Fleur Bouwer"
